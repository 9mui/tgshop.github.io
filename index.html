<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#ffffff" />
  <title>Магазин одежды</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="styles.css?v=2" />
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <button id="browserBackButton" class="browser-back-button hidden" type="button" aria-label="Вернуться в каталог">
        <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6" /></svg>
      </button>
      <div>
        <h1 id="screenTitle" class="app-title">Магазин одежды</h1>
        <p id="screenSubtitle" class="app-subtitle">Базовые вещи на каждый день</p>
      </div>
      <button id="cartShortcut" class="cart-shortcut" type="button" aria-label="Открыть корзину">
        <svg aria-hidden="true" viewBox="0 0 24 24">
          <path d="M3 4h2l2.1 10.2a2 2 0 0 0 2 1.6h7.7a2 2 0 0 0 1.9-1.4L20 8H6.2M9.5 20a.5.5 0 1 1-1 0 .5.5 0 0 1 1 0Zm8 0a.5.5 0 1 1-1 0 .5.5 0 0 1 1 0Z" />
        </svg>
        <span id="cartCount" class="cart-count" aria-live="polite">0</span>
      </button>
    </header>

    <section id="catalogScreen" class="screen" aria-labelledby="screenTitle">
      <nav id="categories" class="categories" aria-label="Категории товаров"></nav>
      <main id="catalog" class="catalog"></main>
    </section>

    <section id="cartScreen" class="screen hidden" aria-labelledby="screenTitle">
      <div id="cartItems" class="cart-items"></div>
      <div id="cartSummary" class="cart-summary hidden">
        <span>Итого</span>
        <strong id="cartTotal">0 ₽</strong>
      </div>
    </section>
  </div>

  <button id="browserMainButton" class="browser-main-button hidden" type="button"></button>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="products.js?v=2"></script>
  <script src="app.js?v=2"></script>
</body>
</html>
