<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Магазин одежды</title>

  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="header">
    <h1 class="header__title">Магазин одежды</h1>
    <button id="cartBtn" class="cart-btn">
      🛒 <span id="cartCount" class="cart-count">0</span>
    </button>
  </header>

  <!-- Фильтр категорий -->
  <nav id="categories" class="categories"></nav>

  <!-- Сетка товаров -->
  <main id="catalog" class="catalog"></main>

  <!-- Корзина (модальное окно) -->
  <div id="cartModal" class="modal hidden">
    <div class="modal__content">
      <div class="modal__header">
        <h2>Корзина</h2>
        <button id="closeCart" class="modal__close">✕</button>
      </div>
      <div id="cartItems" class="cart-items"></div>
      <div class="cart-footer">
        <span>Итого: <strong id="cartTotal">0 ₽</strong></span>
        <button id="checkoutBtn" class="checkout-btn">Оформить заказ</button>
      </div>
    </div>
  </div>

  <script src="products.js"></script>
  <script src="app.js"></script>
</body>
</html>
